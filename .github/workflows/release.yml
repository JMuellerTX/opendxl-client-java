name: Release

# Cuts a GitHub release from a tag and publishes the same artifacts to this repository's
# GitHub Packages Maven registry.
#
#   git tag -a v0.2.9-fork.1 -m "..." && git push origin v0.2.9-fork.1
#
# The coordinates stay com.opendxl:dxlclient on purpose - the jar is meant to be a drop-in
# replacement - and the version carries the -fork.n marker so a build cannot confuse it with
# the artifact of the same coordinates on Maven Central. Nothing here publishes to Maven
# Central: the com.opendxl namespace there is proven by control of the opendxl.com domain and
# belongs to the upstream project (see the security page of the documentation).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build the release from"
        required: true

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event.inputs.tag || github.ref }}
        submodules: recursive
        fetch-depth: 0

    - name: Set up Java 21
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 21

    - name: Check the tag against the project version
      run: |
        set -eu
        tag="${{ github.event.inputs.tag || github.ref_name }}"
        version="$(sed -n 's/^version=//p' gradle.properties)"
        echo "tag=$tag version=$version"
        [ "${tag#v}" = "$version" ]

    - name: Build
      run: ./gradlew assemble javadocJar sourceJar --console=plain

    # A version in GitHub Packages is immutable, so re-running a release for a tag
    # that was already published answers 409 Conflict and fails the whole job -
    # which also skips the steps below it. That happened for real when the
    # repository moved to another account: the Maven package follows the
    # repository, so all four JDK lines were already there. Publishing is skipped
    # when the exact artifact exists; anything other than "present" or "absent"
    # still fails, so a genuine registry problem is not swallowed.
    - name: Publish to GitHub Packages
      env:
        GITHUB_ACTOR: ${{ github.actor }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITHUB_PACKAGES_URL: https://maven.pkg.github.com/${{ github.repository }}
      run: |
        set -eu
        version="$(sed -n 's/^version=//p' gradle.properties)"
        url="https://maven.pkg.github.com/${{ github.repository }}/com/opendxl/dxlclient/${version}/dxlclient-${version}.jar"
        code="$(curl -sS -o /dev/null -w '%{http_code}' -L -u "$GITHUB_ACTOR:$GITHUB_TOKEN" "$url")"
        case "$code" in
          200)
            echo "dxlclient $version is already in GitHub Packages - nothing to publish."
            echo "  $url"
            ;;
          404)
            ./gradlew publishMavenPublicationToGitHubPackagesRepository --console=plain
            ;;
          *)
            echo "Unexpected status $code from the package registry for $url" >&2
            exit 1
            ;;
        esac

    - name: Collect the artifacts
      run: |
        set -eu
        mkdir -p release
        cp build/libs/*.jar release/
        cd release
        sha256sum * > SHA256SUMS
        ls -l
        cat SHA256SUMS

    - name: Release notes
      run: |
        set -eu
        tag="${{ github.event.inputs.tag || github.ref_name }}"
        version="${tag#v}"
        {
          echo "Built from \\`$tag\\` by \\`.github/workflows/release.yml\\`; \\`SHA256SUMS\\` covers the files below."
          echo
          echo "**This is the maintained fork, not the upstream artifact.** The coordinates are"
          echo "unchanged so the jar drops into an existing build, and the version carries the"
          echo "\\`-fork.n\\` marker so the two cannot be confused. It is **not** on Maven Central: the"
          echo "\\`com.opendxl\\` namespace there is proven by control of the opendxl.com domain and"
          echo "belongs to the upstream project."
          echo
          echo "From this repository's GitHub Packages registry (needs a GitHub token with"
          echo "\\`read:packages\\`, see the GitHub docs on authenticating to the Maven registry):"
          echo
          echo "    <repository>"
          echo "      <id>github</id>"
          echo "      <url>https://maven.pkg.github.com/$GITHUB_REPOSITORY</url>"
          echo "    </repository>"
          echo "    <dependency>"
          echo "      <groupId>com.opendxl</groupId>"
          echo "      <artifactId>dxlclient</artifactId>"
          echo "      <version>$version</version>"
          echo "    </dependency>"
          echo
          echo "Or take the \\`-all\\` jar from the assets below - it is the shaded one the"
          echo "provisioning CLI runs from (\\`java -jar dxlclient-$version-all.jar provisionconfig ...\\`)."
        } > notes.md
        cat notes.md

    - name: Publish the release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -eu
        tag="${{ github.event.inputs.tag || github.ref_name }}"
        if gh release view "$tag" >/dev/null 2>&1; then
          gh release upload "$tag" release/* --clobber
        else
          gh release create "$tag" release/* --title "$tag" --notes-file notes.md
        fi
